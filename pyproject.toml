[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "q3sh"
version = "0.1.1"
description = "Virtue-based AI coherence network — Quantum 3 Shell"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "agents", "virtues", "coherence", "local-llm"]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
ollama = []  # requires local Ollama instance

[project.scripts]
q3sh-voices = "q3sh.bin.voices:main"
q3sh-guardian = "q3sh.guardian:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["q3sh*"]
